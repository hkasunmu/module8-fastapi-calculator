
name: FastAPI Calculator CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run all tests
        run: python -m pytest -v

      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshot
          path: screenshots/application-running.png
          if-no-files-found: ignore

  security:
    name: security
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t calculator-ci:latest .

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: calculator-ci:latest
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  deploy:
    name: deploy
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/module8-fastapi-calculator:latest
